name: Deploy quotes-app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-quotes-app
  cancel-in-progress: true

env:
  DEPLOY_ROOT: /var/www/quotes-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Сервер — Ubuntu 20.04 (glibc 2.31), а ubuntu-latest уже 24.04 (glibc 2.39).
    # better-sqlite3 — нативный модуль, и собранный под 2.39 бинарник на сервере
    # не загрузится. Bullseye даёт ровно ту же glibc 2.31, что и прод.
    container: node:22-bullseye

    steps:
      - name: Install deploy tooling
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            rsync openssh-client python3 make g++
          npm install -g node-gyp@latest

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-bullseye-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-bullseye-

      - name: Install dependencies
        run: npm ci

      # Готовый бинарник better-sqlite3 требует GLIBC_2.33, а и контейнер
      # сборки, и прод — glibc 2.31, так что он не грузится ни там, ни там.
      # Собираем из исходников. prebuilds надо снести ДО сборки по двум
      # причинам: lib/binding.js предпочитает их каталогу build/Release, а
      # binding.gyp при их наличии вообще пропускает компиляцию.
      - name: Rebuild better-sqlite3 from source
        shell: bash
        run: |
          dump() {
            m=$(tail -n 40 /tmp/gyp.log 2>/dev/null | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::сборка better-sqlite3 упала:%0A$m"
          }
          trap dump ERR

          # У better-sqlite3 13.x НЕТ install-скрипта, поэтому `npm rebuild`
          # для него молча не делает ничего. Собираем его собственным
          # скриптом build-release — он зовёт node-gyp с --force_build=1.
          rm -rf node_modules/better-sqlite3/prebuilds
          ( cd node_modules/better-sqlite3 && npm run build-release ) 2>&1 | tee /tmp/gyp.log

          # Трассировщик Next копирует в standalone только prebuilds/, каталог
          # build/ он не видит — без этого шага в бандле не окажется вообще
          # никакого нативного бинарника. Кладём свежесобранный туда, где его
          # ждут и трассировщик, и getBinding() из lib/binding.js.
          mkdir -p node_modules/better-sqlite3/prebuilds
          cp node_modules/better-sqlite3/build/Release/better_sqlite3.node \
             node_modules/better-sqlite3/prebuilds/linux-x64.node
          ls -la node_modules/better-sqlite3/prebuilds/linux-x64.node

      - name: Build
        id: build
        # Дефолтный шелл в Actions — `bash -e {0}`, БЕЗ pipefail: статус шага
        # берётся у последней команды конвейера, то есть у tee, и падение
        # `next build` проходит как успех. Явный `shell: bash` включает
        # `-eo pipefail`. Без этой строки шаг зеленеет на сломанной сборке.
        shell: bash
        env:
          # next build исполняет модули роут-хендлеров, когда собирает page
          # data. В lib/ синглтоны создаются на верхнем уровне модуля (db.ts
          # открывает SQLite, openai-client.ts конструирует клиента), поэтому
          # сборке нужны валидные с виду значения. Боевых секретов в CI нет и
          # быть не должно — подставляем заглушки. В рантайме их перекрывает
          # /var/www/quotes-app/shared/.env.production.
          #
          # Добавляешь новый синглтон в lib/ — проверь сборку без .env и без
          # data/ (как это сделать, написано в CLAUDE.md, раздел «Деплой»).
          DB_PATH: /tmp/build-placeholder.db
          CHAT_GPT_API_KEY: build-placeholder
        run: npm run build 2>&1 | tee /tmp/build.log

      # Логи Actions и summary джоба без авторизации не читаются, а
      # аннотации чек-рана — читаются. Поэтому хвост упавшей сборки уезжает
      # именно в аннотацию: иначе причина падения прод-деплоя видна только
      # тому, кто залогинен в GitHub.
      - name: Surface build failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          msg=$(tail -n 60 /tmp/build.log | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error::next build упал:%0A$msg"

      - name: Inspect build output
        run: |
          info=$(
            {
              echo "--- .next ---";            ls -1 .next 2>&1
              echo "--- .next/standalone ---"; ls -1 .next/standalone 2>&1
              echo "--- .next/static ---";     ls -1 .next/static 2>&1
            } | sed ':a;N;$!ba;s/\n/%0A/g'
          )
          echo "::notice::$info"

      # Сборка бандла и проверка нативного модуля — одним шагом. Всё идёт
      # в подоболочку с set -e, её код возврата проверяется явно, а лог
      # целиком уезжает в аннотацию. Ловушки ERR и pipefail тут уже дважды
      # давали ложную картину: шаг падал раньше, чем успевал что-то сказать.
      - name: Assemble and verify bundle
        shell: bash
        run: |
          (
            set -e
            echo "== .next ==";               ls -1 .next
            echo "== .next/standalone ==";    ls -1a .next/standalone

            # server.js ждёт static и public рядом с собой — next их не
            # копирует, рассчитывая на CDN, а CDN у нас нет.
            mkdir -p .next/standalone/.next
            rm -rf .next/standalone/.next/static .next/standalone/public
            cp -r .next/static .next/standalone/.next/static
            if [ -d public ]; then cp -r public .next/standalone/public; fi
            cp ecosystem.config.js .next/standalone/ecosystem.config.js
            echo "== размер бандла =="; du -sh .next/standalone

            echo "== better-sqlite3 в бандле =="
            find .next/standalone/node_modules/better-sqlite3 -type f

            # Грузится здесь, на glibc 2.31 — значит загрузится и на проде,
            # у него та же 2.31. Это и есть проверка совместимости.
            echo "== проверка загрузки =="
            node -e "
              const p = require.resolve('better-sqlite3', { paths: ['.next/standalone'] });
              const db = new (require(p))(':memory:');
              console.log('select 1 ->', db.prepare('select 1 as ok').get().ok);
            "
          ) > /tmp/asm.log 2>&1
          rc=$?
          cat /tmp/asm.log
          if [ "$rc" -ne 0 ]; then
            msg=$(tail -n 60 /tmp/asm.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::сборка/проверка бандла упала (код $rc):%0A$msg"
            exit 1
          fi

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # known_hosts строим сами под тот хост, к которому реально идём, и
      # сверяем с прибитым отпечатком. Публичный ключ хоста — не секрет, а
      # вот секрет DEPLOY_KNOWN_HOSTS был скопирован из quotes-frontend и
      # оказался записан под другим именем хоста: ключи верные, а проверка
      # падала с "Host key verification failed". Пин по отпечатку от этого
      # класса ошибок избавляет и при этом остаётся защитой от подмены.
      - name: Trust server host key
        shell: bash
        env:
          EXPECTED_ED25519: SHA256:h1KJBruD9ApUMEGPUp8rfbf2AcXFUIuY1CrkT5RNVcw
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 "${{ secrets.DEPLOY_HOST }}" > ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

          got=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}' | head -1)
          if [ "$got" != "$EXPECTED_ED25519" ]; then
            echo "::error::отпечаток host key не совпал.%0Aожидали $EXPECTED_ED25519%0Aполучили ${got:-<пусто>}"
            exit 1
          fi
          echo "host key сервера совпал с ожидаемым: $got"

      # Отпечаток host key совпадает, ключ в агенте верный, и всё равно
      # Host key verification failed. Вместо новых догадок — пробуем набор
      # вариантов за один прогон и смотрим, какой проходит.
      - name: Check SSH connectivity
        shell: bash
        run: |
          esc() { sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          HOST='${{ secrets.DEPLOY_HOST }}'
          USER='${{ secrets.DEPLOY_USER }}'

          try() {
            desc="$1"; shift
            if ssh -o BatchMode=yes -o ConnectTimeout=10 "$@" "$USER@$HOST" 'echo ok' >/dev/null 2>&1
            then echo "OK    $desc"; else echo "FAIL  $desc"; fi
          }

          {
            # Длина и «похоже на IP или на домен» — про содержимое секрета
            # ничего не выдают, но ловят лишние пробелы и перевод строки.
            echo "длина DEPLOY_HOST: ${#HOST}, DEPLOY_USER: ${#USER}"
            case "$HOST" in
              *[a-zA-Z]*) echo "DEPLOY_HOST похож на доменное имя" ;;
              *)          echo "DEPLOY_HOST похож на IP" ;;
            esac
            echo "-- known_hosts --"
            awk '{print "поле хоста длиной " length($1) ", тип " $2}' ~/.ssh/known_hosts
            if ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null 2>&1
            then echo "запись для DEPLOY_HOST: НАЙДЕНА"
            else echo "запись для DEPLOY_HOST: НЕ найдена"; fi

            echo "-- варианты подключения --"
            try "как есть"
            try "CheckHostIP=no"              -o CheckHostIP=no
            try "accept-new"                  -o StrictHostKeyChecking=accept-new
            try "свой known_hosts из keyscan" -o CheckHostIP=no \
                -o UserKnownHostsFile=/tmp/kh
          } > /tmp/sshdiag.txt 2>&1
          cat /tmp/sshdiag.txt
          echo "::error::диагностика SSH:%0A$(esc < /tmp/sshdiag.txt)"
          exit 1

      - name: Prepare release directory
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<EOF
            set -euo pipefail
            RELEASE="${{ env.DEPLOY_ROOT }}/releases/${{ github.sha }}"
            mkdir -p "${{ env.DEPLOY_ROOT }}/releases" "${{ env.DEPLOY_ROOT }}/shared"
            rm -rf "\$RELEASE"
            # Хардлинк-копия предыдущего релиза: rsync дальше перельёт только
            # изменившееся, а диск не расходуется на полную копию бандла.
            if [ -d "${{ env.DEPLOY_ROOT }}/current" ]; then
              cp -al "\$(readlink -f "${{ env.DEPLOY_ROOT }}/current")" "\$RELEASE"
            else
              mkdir -p "\$RELEASE"
            fi
          EOF

      - name: Upload bundle
        run: |
          rsync -az --delete \
            .next/standalone/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_ROOT }}/releases/${{ github.sha }}/"

      - name: Activate release
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<EOF
            set -euo pipefail
            ROOT="${{ env.DEPLOY_ROOT }}"
            RELEASE="\$ROOT/releases/${{ github.sha }}"

            test -f "\$ROOT/shared/.env.production" || {
              echo "Нет \$ROOT/shared/.env.production — деплой остановлен" >&2
              exit 1
            }
            ln -sfn ../../shared/.env.production "\$RELEASE/.env.production"

            ln -sfn "\$RELEASE" "\$ROOT/current.tmp"
            mv -Tf "\$ROOT/current.tmp" "\$ROOT/current"

            pm2 startOrReload "\$ROOT/current/ecosystem.config.js" --update-env
            pm2 save --force

            # Держим три последних релиза — этого хватает на откат, а диска
            # на слабой VPS не так много.
            ls -1dt "\$ROOT"/releases/*/ | tail -n +4 | xargs -r rm -rf
          EOF

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            code=$(ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/quotes \
                 -H 'Content-Type: application/json' -d '{\"limit\":1}'" || true)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 3
          done
          echo "Приложение не ответило 200 после деплоя" >&2
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "pm2 logs quotes-app --lines 50 --nostream" || true
          exit 1
